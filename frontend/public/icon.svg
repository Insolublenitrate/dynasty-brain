<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Tactical Carbon Fiber / Turf Grid Background Pattern -->
    <pattern id="svgShieldFieldGrid" width="12" height="12" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="12" y2="0" stroke="#ffffff" stroke-width="0.4" stroke-opacity="0.08" />
      <line x1="0" y1="0" x2="0" y2="12" stroke="#ffffff" stroke-width="0.4" stroke-opacity="0.08" />
    </pattern>

    <!-- Shield Body Linear Gradient -->
    <linearGradient id="svgShieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c09" />
      <stop offset="50%" stop-color="#050806" />
      <stop offset="100%" stop-color="#0f1612" />
    </linearGradient>

    <!-- Football Facet Gradient -->
    <linearGradient id="svgFootballGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0f0c" />
      <stop offset="45%" stop-color="#131c17" />
      <stop offset="55%" stop-color="#1c2821" />
      <stop offset="100%" stop-color="#0e1410" />
    </linearGradient>

    <!-- Razor Stealth Chevron Arrowhead Marker -->
    <marker 
      id="svg-blindside-arrowhead" 
      viewBox="0 0 10 10" 
      refX="6.5" 
      refY="5" 
      markerWidth="6" 
      markerHeight="6" 
      orient="auto-start-reverse"
    >
      <path d="M 0 1.5 L 9 5 L 0 8.5 L 2.5 5 Z" fill="#f97316" />
    </marker>
  </defs>

  <!-- 1. TACTICAL SHIELD CREST SILHOUETTE -->
  <path 
    d="M 24 8 L 76 8 L 92 24 L 92 56 Q 92 78 50 94 Q 8 78 8 56 L 8 24 L 24 8 Z" 
    fill="url(#svgShieldGradient)"
    stroke="rgba(249, 115, 22, 0.5)"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Tactical Grid Overlay inside Shield -->
  <path 
    d="M 24 8 L 76 8 L 92 24 L 92 56 Q 92 78 50 94 Q 8 78 8 56 L 8 24 L 24 8 Z" 
    fill="url(#svgShieldFieldGrid)"
    opacity="0.85"
  />

  <!-- Inner Shield Bevel Inset -->
  <path 
    d="M 26 12 L 74 12 L 88 26 L 88 55 Q 88 74 50 89 Q 12 74 12 55 L 12 26 L 26 12 Z" 
    fill="none"
    stroke="#ffffff"
    stroke-width="0.75"
    stroke-opacity="0.15"
    stroke-linejoin="round"
  />

  <!-- 2. FIELD YARDLINES & LINE OF SCRIMMAGE -->
  <line x1="50" y1="12" x2="50" y2="88" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.25" />
  <line x1="46" y1="32" x2="54" y2="32" stroke="#ffffff" stroke-width="1" stroke-opacity="0.25" />
  <line x1="44" y1="50" x2="56" y2="50" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.3" />
  <line x1="46" y1="68" x2="54" y2="68" stroke="#ffffff" stroke-width="1" stroke-opacity="0.25" />

  <!-- 3. CORE EMBLEM: THE TACTICAL FOOTBALL -->
  <path 
    d="M 25 73 C 27 45, 45 27, 75 25 C 73 53, 55 71, 25 73 Z" 
    fill="url(#svgFootballGradient)"
    stroke="#ffffff"
    stroke-width="0.8"
    stroke-opacity="0.25"
  />
  <path d="M 25 73 L 75 25" stroke="#000000" stroke-width="1" stroke-opacity="0.3" />

  <!-- Football Laser Laces -->
  <line x1="43" y1="55" x2="57" y2="41" stroke="#ffffff" stroke-width="1.75" stroke-linecap="round" stroke-opacity="0.95" />
  <line x1="41" y1="51" x2="47" y2="57" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.9" />
  <line x1="45" y1="47" x2="51" y2="53" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.9" />
  <line x1="49" y1="43" x2="55" y2="49" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.9" />
  <line x1="53" y1="39" x2="59" y2="45" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.9" />

  <!-- 4. DEFENSIVE THREAT 'X' -->
  <circle cx="70" cy="62" r="7" fill="none" stroke="#f43f5e" stroke-width="0.75" stroke-opacity="0.4" stroke-dasharray="2 2" />
  <line x1="66" y1="58" x2="74" y2="66" stroke="#f43f5e" stroke-width="2.2" stroke-linecap="round" />
  <line x1="74" y1="58" x2="66" y2="66" stroke="#f43f5e" stroke-width="2.2" stroke-linecap="round" />

  <!-- 5. PASS VECTOR TELEMETRY -->
  <line x1="26" y1="66" x2="74" y2="26" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity="0.75" />

  <!-- 6. THE "BLINDSIDE" ROUTE CUT & STRIKE ARROW -->
  <path 
    d="M 26 66 Q 24 38 48 32 T 80 18" 
    fill="none" 
    stroke="#f97316" 
    stroke-width="3.2" 
    stroke-linecap="round" 
    marker-end="url(#svg-blindside-arrowhead)"
    stroke-dasharray="90"
    stroke-dashoffset="0"
  >
    <animate attributeName="stroke-dashoffset" values="90;0;-90" dur="2.8s" repeatCount="indefinite" />
  </path>

  <!-- 7. OFFENSIVE PLAYMAKER / QB POCKET NODE -->
  <circle cx="26" cy="66" r="10" fill="none" stroke="#f97316" stroke-width="0.75" stroke-opacity="0.4" stroke-dasharray="2 2">
    <animate attributeName="r" values="8;12;8" dur="2.2s" repeatCount="indefinite" />
    <animate attributeName="stroke-opacity" values="0.2;0.6;0.2" dur="2.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="26" cy="66" r="7" fill="#060907" stroke="#f97316" stroke-width="2.8" />
  <circle cx="26" cy="66" r="2" fill="#ffffff" />

  <!-- 8. TACTICAL HUD CORNER BRACKETS -->
  <path d="M 18 20 L 14 20 L 14 24" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.35" />
  <path d="M 82 20 L 86 20 L 86 24" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.35" />
</svg>
