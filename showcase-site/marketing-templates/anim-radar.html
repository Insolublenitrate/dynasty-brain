<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Animated Positional Radar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700;900&family=JetBrains+Mono:wght@700;800;900&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 800px;
      height: 500px;
      overflow: hidden;
      background: #060907;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 30px;
    }
    .panel-wrap {
      background: #080D0A;
      border: 2px solid #06b6d4;
      border-radius: 18px;
      padding: 20px 24px;
      box-shadow: 0 0 35px rgba(6,182,212,0.25);
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 20px;
      font-weight: 900;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .team-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 900;
      color: #06b6d4;
      background: rgba(6,182,212,0.15);
      border: 1px solid #06b6d4;
      padding: 4px 12px;
      border-radius: 999px;
    }
    .content-split {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
      align-items: center;
      margin: 10px 0;
    }
    .radar-box {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .stats-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .stat-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stat-name {
      font-size: 14px;
      font-weight: 800;
    }
    .stat-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 900;
    }
    .radar-polygon {
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .foot-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .foot-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 800;
      color: #A1A1AA;
    }
    .foot-domain {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 800;
      color: #f97316;
    }
  </style>
</head>
<body>
  <div class="panel-wrap">
    <div class="top-bar">
      <div class="panel-title">
        <span></span> 100-INDEX POSITIONAL STRENGTH RADAR
      </div>
      <div class="team-badge" id="teamBadge"> CeeDeez Nutz (WR Bully)</div>
    </div>

    <div class="content-split">
      <div class="radar-box">
        <svg width="260" height="260" viewBox="0 0 260 260">
          <circle cx="130" cy="130" r="100" fill="none" stroke="rgba(255,255,255,0.12)" stroke-dasharray="4 4"/>
          <circle cx="130" cy="130" r="70" fill="none" stroke="rgba(255,255,255,0.18)"/>
          <circle cx="130" cy="130" r="40" fill="none" stroke="rgba(255,255,255,0.1)"/>
          
          <line x1="130" y1="20" x2="130" y2="240" stroke="rgba(255,255,255,0.2)"/>
          <line x1="20" y1="130" x2="240" y2="130" stroke="rgba(255,255,255,0.2)"/>

          <polygon id="radarPoly" points="130,45 220,130 130,195 55,130" fill="rgba(34,197,94,0.35)" stroke="#22c55e" stroke-width="3" class="radar-polygon"/>

          <text x="130" y="16" fill="#f97316" font-family="JetBrains Mono" font-size="11" font-weight="bold" text-anchor="middle">QB</text>
          <text x="250" y="134" fill="#22c55e" font-family="JetBrains Mono" font-size="11" font-weight="bold" text-anchor="middle">WR</text>
          <text x="130" y="254" fill="#ef4444" font-family="JetBrains Mono" font-size="11" font-weight="bold" text-anchor="middle">TE</text>
          <text x="10" y="134" fill="#38bdf8" font-family="JetBrains Mono" font-size="11" font-weight="bold" text-anchor="middle">RB</text>
        </svg>
      </div>

      <div class="stats-col">
        <div class="stat-card">
          <span class="stat-name"> Quarterback (QB)</span>
          <span class="stat-val" id="qbVal" style="color:#f97316;">112.4</span>
        </div>
        <div class="stat-card">
          <span class="stat-name"> Wide Receiver (WR)</span>
          <span class="stat-val" id="wrVal" style="color:#22c55e;">152.8 (Apex)</span>
        </div>
        <div class="stat-card">
          <span class="stat-name"> Tight End (TE)</span>
          <span class="stat-val" id="teVal" style="color:#ef4444;">74.2 (Deficit)</span>
        </div>
        <div class="stat-card">
          <span class="stat-name"> Running Back (RB)</span>
          <span class="stat-val" id="rbVal" style="color:#38bdf8;">108.6</span>
        </div>
      </div>
    </div>

    <div class="foot-bar">
      <div class="foot-sub">100 = Exact League Average Benchmark</div>
      <div class="foot-domain">ffdashboard.kindofabigdill.world</div>
    </div>
  </div>

  <script>
    const teamData = [
      {
        badge: " CeeDeez Nutz (WR Bully)",
        poly: "130,45 220,130 130,195 55,130",
        fill: "rgba(34,197,94,0.35)",
        stroke: "#22c55e",
        qb: "112.4", wr: "152.8 (Apex)", te: "74.2 (Deficit)", rb: "108.6"
      },
      {
        badge: " Run CMC & The Hamstrings",
        poly: "130,60 170,130 130,160 35,130",
        fill: "rgba(6,182,212,0.35)",
        stroke: "#06b6d4",
        qb: "104.2", wr: "115.0", te: "98.4", rb: "148.2 (Apex)"
      },
      {
        badge: " 1st Round Pick Addicts",
        poly: "130,80 150,130 130,140 100,130",
        fill: "rgba(168,85,247,0.35)",
        stroke: "#a855f7",
        qb: "88.0", wr: "92.4", te: "82.0", rb: "76.4 (4x 1sts)"
      }
    ];

    let tIdx = 0;
    setInterval(() => {
      tIdx = (tIdx + 1) % teamData.length;
      const d = teamData[tIdx];
      document.getElementById('teamBadge').innerText = d.badge;
      const poly = document.getElementById('radarPoly');
      poly.setAttribute('points', d.poly);
      poly.setAttribute('fill', d.fill);
      poly.setAttribute('stroke', d.stroke);
      document.getElementById('qbVal').innerText = d.qb;
      document.getElementById('wrVal').innerText = d.wr;
      document.getElementById('teVal').innerText = d.te;
      document.getElementById('rbVal').innerText = d.rb;
    }, 2600);
  </script>
</body>
</html>
