<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Animated Power Matrix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700;900&family=JetBrains+Mono:wght@700;800;900&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 800px;
      height: 500px;
      overflow: hidden;
      background: #060907;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 30px;
    }
    .panel-wrap {
      background: #080D0A;
      border: 2px solid #a855f7;
      border-radius: 18px;
      padding: 20px 24px;
      box-shadow: 0 0 35px rgba(168,85,247,0.25);
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 20px;
      font-weight: 900;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .panel-live {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 900;
      color: #22c55e;
      background: rgba(34,197,94,0.15);
      border: 1px solid #22c55e;
      padding: 3px 10px;
      border-radius: 999px;
    }
    .matrix-canvas {
      position: relative;
      height: 310px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      background: rgba(0,0,0,0.5);
      overflow: hidden;
      margin: 10px 0;
    }
    .axis-h {
      position: absolute;
      top: 50%; left: 0; right: 0;
      height: 1px;
      border-top: 1px dashed rgba(255,255,255,0.2);
    }
    .axis-v {
      position: absolute;
      left: 50%; top: 0; bottom: 0;
      width: 1px;
      border-left: 1px dashed rgba(255,255,255,0.2);
    }
    .tag-quad {
      position: absolute;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .t-tl { top: 10px; left: 14px; color: #c084fc; }
    .t-tr { top: 10px; right: 14px; color: #22c55e; }
    .t-bl { bottom: 10px; left: 14px; color: #38bdf8; }
    .t-br { bottom: 10px; right: 14px; color: #ef4444; }

    .team-bubble {
      position: absolute;
      background: rgba(12,16,13,0.95);
      border: 1.5px solid rgba(255,255,255,0.25);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.6);
      transition: all 0.5s ease;
    }
    .team-bubble em {
      font-family: 'JetBrains Mono', monospace;
      font-style: normal;
      color: #f97316;
      font-weight: 900;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; }

    .laser-scan {
      position: absolute;
      top: 0; bottom: 0;
      width: 4px;
      background: linear-gradient(180deg, transparent, #a855f7, transparent);
      box-shadow: 0 0 15px #a855f7;
      animation: laserSweep 4s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes laserSweep {
      0% { left: 0%; opacity: 0.2; }
      50% { opacity: 0.9; }
      100% { left: 98%; opacity: 0.2; }
    }

    .foot-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .foot-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 800;
      color: #A1A1AA;
    }
    .foot-domain {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 800;
      color: #f97316;
    }
  </style>
</head>
<body>
  <div class="panel-wrap">
    <div class="top-bar">
      <div class="panel-title">
        <span>⚡</span> 12-TEAM DYNAMIC LIFECYCLE MATRIX
      </div>
      <div class="panel-live">● REAL-TIME QUANT ENGINE</div>
    </div>

    <div class="matrix-canvas">
      <div class="axis-h"></div>
      <div class="axis-v"></div>
      <div class="laser-scan"></div>

      <span class="tag-quad t-tl">👑 DYNASTY APEX</span>
      <span class="tag-quad t-tr">🏆 WIN-NOW GOLIATH</span>
      <span class="tag-quad t-bl">📈 PRODUCTIVE STRUGGLE</span>
      <span class="tag-quad t-br">📉 REBUILDING VALLEY</span>

      <div class="team-bubble" style="left: 10%; top: 22%;">
        <span class="dot" style="background:#a855f7;"></span>
        Puka Nacua Matata <em>57.3</em>
      </div>
      <div class="team-bubble" style="left: 56%; top: 16%;">
        <span class="dot" style="background:#22c55e;"></span>
        CeeDeez Nutz <em>63.4</em>
      </div>
      <div class="team-bubble" style="left: 56%; top: 40%;">
        <span class="dot" style="background:#22c55e;"></span>
        Run CMC <em>59.6</em>
      </div>
      <div class="team-bubble" style="left: 10%; top: 62%;">
        <span class="dot" style="background:#38bdf8;"></span>
        1st Rd Addicts <em>37.2</em>
      </div>
      <div class="team-bubble" style="left: 56%; top: 70%;">
        <span class="dot" style="background:#ef4444;"></span>
        Waffle House <em>24.8</em>
      </div>
    </div>

    <div class="foot-bar">
      <div class="foot-sub">70% Max PF · 30% Pick Capital</div>
      <div class="foot-domain">waiverwiretap.kindofabigdill.com</div>
    </div>
  </div>
</body>
</html>
