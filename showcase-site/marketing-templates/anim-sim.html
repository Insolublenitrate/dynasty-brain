<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Animated Matchup Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700;900&family=JetBrains+Mono:wght@700;800;900&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 800px;
      height: 500px;
      overflow: hidden;
      background: #060907;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 30px;
    }
    .panel-wrap {
      background: #080D0A;
      border: 2px solid #22c55e;
      border-radius: 18px;
      padding: 20px 24px;
      box-shadow: 0 0 35px rgba(34,197,94,0.25);
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 20px;
      font-weight: 900;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sim-counter {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 900;
      color: #22c55e;
      background: rgba(34,197,94,0.15);
      border: 1px solid #22c55e;
      padding: 3px 12px;
      border-radius: 999px;
    }
    .matchup-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 20px;
      align-items: center;
      margin: 12px 0;
    }
    .team-col {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 16px 20px;
      text-align: center;
    }
    .team-name {
      font-size: 15px;
      font-weight: 900;
      margin-bottom: 6px;
    }
    .team-score {
      font-family: 'JetBrains Mono', monospace;
      font-size: 32px;
      font-weight: 900;
      color: #f97316;
      margin-bottom: 4px;
    }
    .team-range {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #A1A1AA;
    }
    .vs-tag {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 22px;
      font-weight: 900;
      color: #f97316;
    }
    .meter-wrap {
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 14px 18px;
    }
    .meter-labels {
      display: flex;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 900;
      margin-bottom: 8px;
    }
    .bar-track {
      height: 14px;
      border-radius: 999px;
      background: #38bdf8;
      overflow: hidden;
      display: flex;
    }
    .bar-fill {
      height: 100%;
      background: #22c55e;
      transition: width 0.5s ease;
    }
    .foot-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .foot-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 800;
      color: #A1A1AA;
    }
    .foot-domain {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 800;
      color: #f97316;
    }
  </style>
</head>
<body>
  <div class="panel-wrap">
    <div class="top-bar">
      <div class="panel-title">
        <span></span> 10,000-GAME MATCHUP MONTE CARLO SIMULATOR
      </div>
      <div class="sim-counter" id="simCount">10,000 SIMS DONE</div>
    </div>

    <div class="matchup-grid">
      <div class="team-col">
        <div class="team-name" style="color:#22c55e;"> CeeDeez Nutz</div>
        <div class="team-score" id="score1">138.4</div>
        <div class="team-range">Floor: 112.0 · Ceiling: 174.5</div>
      </div>
      <div class="vs-tag">VS</div>
      <div class="team-col">
        <div class="team-name" style="color:#38bdf8;"> Run CMC</div>
        <div class="team-score" id="score2" style="color:#38bdf8;">124.6</div>
        <div class="team-range">Floor: 98.4 · Ceiling: 161.2</div>
      </div>
    </div>

    <div class="meter-wrap">
      <div class="meter-labels">
        <span style="color:#22c55e;" id="winProb1">68.4% WIN PROBABILITY</span>
        <span style="color:#38bdf8;" id="winProb2">31.6% WIN PROBABILITY</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" id="barFill" style="width: 68.4%;"></div>
      </div>
    </div>

    <div class="foot-bar">
      <div class="foot-sub">Simulates injuries, weather, TD variance & snap counts</div>
      <div class="foot-domain">ffdashboard.kindofabigdill.world</div>
    </div>
  </div>

  <script>
    const sims = [
      { s1: "138.4", s2: "124.6", p1: "68.4%", p2: "31.6%", w: "68.4%" },
      { s1: "144.2", s2: "119.8", p1: "74.2%", p2: "25.8%", w: "74.2%" },
      { s1: "131.0", s2: "136.5", p1: "48.1%", p2: "51.9%", w: "48.1%" },
      { s1: "152.6", s2: "128.0", p1: "79.5%", p2: "20.5%", w: "79.5%" }
    ];

    let sIdx = 0;
    setInterval(() => {
      sIdx = (sIdx + 1) % sims.length;
      const cur = sims[sIdx];
      document.getElementById('score1').innerText = cur.s1;
      document.getElementById('score2').innerText = cur.s2;
      document.getElementById('winProb1').innerText = cur.p1 + " WIN PROBABILITY";
      document.getElementById('winProb2').innerText = cur.p2 + " WIN PROBABILITY";
      document.getElementById('barFill').style.width = cur.w;
    }, 2400);
  </script>
</body>
</html>
